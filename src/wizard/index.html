<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>嘉立创硬件 Agent · 从想法到工程包</title>
<style>
  :root{
    --bg:#0b1220; --panel:#121c2e; --panel2:#16233a; --line:#24344f;
    --text:#eef4ff; --muted:#93a7c4; --accent:#4cc2ff; --ok:#4ade80;
    --warn:#fbbf24; --bad:#f87171;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.65 "Microsoft YaHei","Segoe UI",system-ui,sans-serif}
  .wrap{max-width:920px;margin:0 auto;padding:32px 24px 80px}
  header{display:flex;align-items:baseline;gap:14px;margin-bottom:8px}
  h1{font-size:22px;margin:0;letter-spacing:.3px}
  .sub{color:var(--muted);font-size:13px}
  .steps{display:flex;gap:8px;margin:24px 0 28px;flex-wrap:wrap}
  .step{flex:1;min-width:130px;padding:10px 12px;border:1px solid var(--line);
    border-radius:10px;background:var(--panel);opacity:.45;font-size:13px;transition:.2s}
  .step.on{opacity:1;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .step.done{opacity:1;border-color:#2e6b4a}
  .step b{display:block;font-size:12px;color:var(--muted);font-weight:600}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:18px}
  h2{font-size:17px;margin:0 0 6px}
  .hint{color:var(--muted);font-size:13px;margin:0 0 16px}
  textarea{width:100%;min-height:110px;resize:vertical;background:var(--panel2);
    color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;
    font:inherit;outline:none}
  textarea:focus{border-color:var(--accent)}
  button{cursor:pointer;font:inherit;border-radius:9px;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);padding:9px 16px;transition:.15s}
  button:hover:not(:disabled){border-color:var(--accent)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#062033;font-weight:700}
  button.ghost{background:transparent}
  .row{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .chip{font-size:13px;padding:6px 12px;border-radius:99px}
  .q{margin-bottom:22px}
  .q:last-child{margin-bottom:0}
  .q h3{font-size:15px;margin:0 0 4px}
  .q p{color:var(--muted);font-size:13px;margin:0 0 10px}
  .opts{display:grid;gap:8px}
  .opt{text-align:left;padding:11px 14px;display:flex;justify-content:space-between;
    align-items:center;gap:10px}
  .opt.sel{border-color:var(--accent);background:rgba(76,194,255,.1)}
  .opt small{color:var(--muted);font-size:12px;text-align:right}
  .notice{border-left:3px solid var(--warn);background:rgba(251,191,36,.08);
    padding:10px 14px;border-radius:8px;font-size:13px;margin:12px 0}
  .notice.bad{border-color:var(--bad);background:rgba(248,113,113,.08)}
  .notice.ok{border-color:var(--ok);background:rgba(74,222,128,.08)}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600}
  code{background:var(--panel2);padding:1px 6px;border-radius:5px;font-size:12.5px}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:6px 14px;font-size:13.5px;margin-top:10px}
  .kv dt{color:var(--muted)}
  .kv dd{margin:0}
  .files{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:10px}
  .file{display:flex;justify-content:space-between;padding:7px 12px;font-size:12.5px;
    border-bottom:1px solid var(--line);gap:12px}
  .file:last-child{border-bottom:0}
  .file span:last-child{color:var(--muted);white-space:nowrap}
  .err{color:var(--bad);font-size:13px;margin-top:10px}
  .busy{color:var(--accent);font-size:13px;margin-top:10px}
  footer{color:var(--muted);font-size:12px;margin-top:40px;line-height:1.8;
    border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>嘉立创硬件 Agent</h1>
    <span class="sub">从一句话想法，到可在嘉立创 EDA 打开的工程包</span>
  </header>

  <nav class="steps" id="steps"></nav>
  <main id="view"></main>

  <footer>
    <div>当前是链路验证版本：只支持「5V LED 指示灯板」和「RC 低通滤波器板」两个固定模板。</div>
    <div>不包含 Gerber、CPL、外壳 CAD、固件，也不保证可直接生产。</div>
  </footer>
</div>

<script>
'use strict';
const STEPS = ['说出想法','澄清需求','选择方案','预览确认','获取工程包'];
const $ = (id) => document.getElementById(id);

const state = {
  sessionId: null, step: 1, idea: '',
  questions: [], answers: {}, detected: [],
  options: [], unmet: [], chosen: null, preview: null, result: null,
  busy: false, error: ''
};

function esc(v){
  return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function api(path, body){
  const res = await fetch(path, body === undefined ? {} : {
    method: 'POST',
    headers: {'content-type':'application/json'},
    body: JSON.stringify(body)
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}

function renderSteps(){
  $('steps').innerHTML = STEPS.map((name, i) => {
    const n = i + 1;
    const cls = n === state.step ? 'on' : (n < state.step ? 'done' : '');
    return `<div class="step ${cls}"><b>0${n}</b>${esc(name)}</div>`;
  }).join('');
}

function errorBlock(){
  return state.error ? `<div class="err">${esc(state.error)}</div>` : '';
}

function busyBlock(text){
  return state.busy ? `<div class="busy">${esc(text)}</div>` : '';
}

// ---------- 步骤 1 ----------
function viewIdea(){
  return `
    <div class="card">
      <h2>你想做一个什么？</h2>
      <p class="hint">用日常语言说就行。比如「我想做个 5V 的 LED 指示灯板，带测试点」。</p>
      <textarea id="ideaInput" maxlength="600" placeholder="说说你想做的东西……">${esc(state.idea)}</textarea>
      <div class="chips">
        <button class="chip ghost" data-sample="我想做一个 5V LED 指示灯板，带测试点，用来确认电源是否正常。">5V LED 指示灯</button>
        <button class="chip ghost" data-sample="我想做一个 RC 低通滤波器板，需要输入和输出测试点，用来滤掉信号里的高频噪声。">RC 低通滤波器</button>
      </div>
      <div class="row">
        <button class="primary" id="beginBtn" ${state.busy ? 'disabled' : ''}>开始</button>
        ${busyBlock('正在理解你的需求……')}
      </div>
      ${errorBlock()}
    </div>`;
}

// ---------- 步骤 2 ----------
function viewQuestions(){
  const degradation = state.degradation;
  return `
    <div class="card">
      <h2>再做三个小决定</h2>
      <p class="hint">不确定就选「按推荐方案」，不会影响后面修改。</p>
      ${degradation ? `<div class="notice bad">
        <b>${esc(degradation.reason)}</b><br>
        ${esc(degradation.supported)}<br>${esc(degradation.action)}
      </div>` : ''}
      ${state.questions.map((q) => `
        <div class="q">
          <h3>${esc(q.title)}</h3>
          <p>${esc(q.desc)}</p>
          <div class="opts">
            ${q.options.map((o) => {
              const sel = (state.answers[q.id] || 'auto') === o.value;
              return `<button class="opt ${sel?'sel':''}" data-q="${esc(q.id)}" data-v="${esc(o.value)}">
                <span>${esc(o.label)}</span><small>${esc(o.sub || '')}</small>
              </button>`;
            }).join('')}
          </div>
        </div>`).join('')}
      <div class="row">
        <button class="ghost" data-go="1">返回修改想法</button>
        <button class="primary" id="answersBtn" ${state.busy ? 'disabled' : ''}>看看有哪些方案</button>
      </div>
      ${busyBlock('正在匹配已验证电路……')}
      ${errorBlock()}
    </div>`;
}

// ---------- 步骤 3 ----------
function viewOptions(){
  const cards = state.options.map((o) => {
    const disabled = !o.canGenerate;
    const list = o.designators.length
      ? `<table><tr><th>器件</th><td>${o.designators.map(esc).join('、')}</td></tr>
         <tr><th>网络</th><td>${o.nets.map(esc).join('、')}</td></tr>
         <tr><th>元件数</th><td>${o.parts}</td></tr></table>`
      : '';
    return `
      <div class="card" style="${disabled ? 'opacity:.75' : ''}">
        <h2>${esc(o.title)}${disabled ? ' <span style="color:var(--warn);font-size:13px">（无法生成）</span>' : ''}</h2>
        <p class="hint">${esc(o.subtitle)}</p>
        ${o.circuit ? `<div style="font-size:13px">电路：<code>${esc(o.circuit)}</code></div>` : ''}
        ${list}
        <div class="notice ${disabled ? 'bad' : 'ok'}">${esc(o.reason)}</div>
        <div class="row">
          <button class="${disabled ? '' : 'primary'}" data-choose="${esc(o.id)}" ${state.busy ? 'disabled' : ''}>
            ${disabled ? '选择这项（会说明边界）' : '选择这套方案'}
          </button>
        </div>
      </div>`;
  }).join('');

  const notice = state.unmet.length
    ? `<div class="notice"><b>以下要求当前无法满足，已如实标注：</b><br>${state.unmet.map(u => '· ' + esc(u.message)).join('<br>')}</div>`
    : '';

  return `
    <div class="card">
      <h2>选一条路线</h2>
      <p class="hint">下面每一套都对应真实可生成的电路，不是示意。</p>
    </div>
    ${notice}
    ${cards}
    ${state.blocked ? `<div class="notice bad">${state.blocked.message}<br>${state.blocked.detail.map(esc).join('<br>')}</div>` : ''}
    <div class="row"><button class="ghost" data-go="2">返回修改需求</button></div>
    ${busyBlock('正在准备方案……')}
    ${errorBlock()}`;
}

// ---------- 步骤 4 ----------
function viewPreview(){
  const p = state.preview;
  if (!p) return '<div class="card"><p>没有可预览的方案。</p></div>';
  return `
    <div class="card">
      <h2>确认一下，再生成</h2>
      <p class="hint">生成后会在本地真实调用上游脚本，产出 <code>.eprj3</code> 并跑格式校验。</p>
      <dl class="kv">
        <dt>方案</dt><dd>${esc(p.title)}</dd>
        <dt>你的原话</dt><dd>${esc(p.userIdea)}</dd>
        <dt>电路</dt><dd><code>${esc(p.circuit)}</code></dd>
        <dt>原理图器件</dt><dd>${p.designators.map(esc).join('、')}</dd>
        <dt>网络</dt><dd>${p.nets.map(esc).join('、')}</dd>
      </dl>
      <h3 style="font-size:14px;margin:20px 0 0">BOM</h3>
      <table>
        <thead><tr><th>位号</th><th>值</th><th>封装</th><th>说明</th></tr></thead>
        <tbody>${p.bom.map(r => `<tr><td>${esc(r.designator)}</td><td>${esc(r.value)}</td><td>${esc(r.footprint)}</td><td>${esc(r.description)}</td></tr>`).join('')}</tbody>
      </table>
      ${p.unmet.length ? `<div class="notice">未满足项：<br>${p.unmet.map(u => '· ' + esc(u.message)).join('<br>')}</div>` : ''}
      <div class="row">
        <label style="font-size:13px;color:var(--muted)">工程名
          <input id="nameInput" value="${esc(p.defaultProjectName)}" style="margin-left:8px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:6px 10px">
        </label>
        <button class="ghost" data-go="3">返回换方案</button>
        <button class="primary" id="generateBtn" ${state.busy ? 'disabled' : ''}>生成工程包</button>
      </div>
      ${busyBlock('正在生成原理图、PCB 并执行格式校验，请稍候……')}
      ${errorBlock()}
    </div>`;
}

// ---------- 步骤 5 ----------
function viewResult(){
  const r = state.result;
  if (!r) return '<div class="card"><p>还没有生成结果。</p></div>';
  return `
    <div class="card">
      <h2>工程包已生成</h2>
      <p class="hint">以下文件都已真实写入磁盘，并已通过上游 <code>validate.js</code> 校验。</p>
      <dl class="kv">
        <dt>工程名</dt><dd>${esc(r.projectName)}</dd>
        <dt>模板</dt><dd>${esc(r.title)}</dd>
        <dt>生成时间</dt><dd>${esc(r.generatedAt)}</dd>
        <dt>网络</dt><dd>${r.verification.nets.map(esc).join('、')}</dd>
        <dt>器件</dt><dd>${r.verification.schDesignators.map(esc).join('、')}</dd>
      </dl>
      <div class="row">
        <a href="/api/download/${esc(state.sessionId)}/zip"><button class="primary">下载 ZIP</button></a>
        <a href="/api/download/${esc(state.sessionId)}/eprj3"><button>下载 .eprj3</button></a>
        <a href="/api/artifact/${esc(state.sessionId)}/manifest.json" target="_blank"><button class="ghost">查看 manifest</button></a>
        <a href="/api/artifact/${esc(state.sessionId)}/BOM.csv" target="_blank"><button class="ghost">查看 BOM</button></a>
      </div>
      <h3 style="font-size:14px;margin:22px 0 0">产物清单（${r.artifacts.length} 个文件）</h3>
      <div class="files">
        ${r.artifacts.map(a => `<div class="file"><span>${esc(a.path)}</span><span>${a.bytes} B · ${esc(a.sha256.slice(0,12))}…</span></div>`).join('')}
      </div>
      <div class="notice bad" style="margin-top:18px">
        <b>这不是可直接生产的设计。</b><br>
        ${r.limitations.map(esc).join('<br>')}
      </div>
      ${r.unmet.length ? `<div class="notice">本次未满足的要求：<br>${r.unmet.map(u => '· ' + esc(u.message)).join('<br>')}</div>` : ''}
      <div class="row">
        <button class="ghost" data-go="1">再做一个新的想法</button>
      </div>
      ${errorBlock()}
    </div>`;
}

function render(){
  renderSteps();
  const views = [viewIdea, viewQuestions, viewOptions, viewPreview, viewResult];
  $('view').innerHTML = views[state.step - 1]();
  bind();
}

function bind(){
  const sampleBtns = document.querySelectorAll('[data-sample]');
  sampleBtns.forEach(b => b.onclick = () => {
    state.idea = b.dataset.sample;
    const t = $('ideaInput');
    if (t) t.value = state.idea;
  });

  if ($('ideaInput')) {
    $('ideaInput').oninput = (e) => { state.idea = e.target.value; };
  }
  if ($('beginBtn')) {
    $('beginBtn').onclick = async () => {
      const text = ($('ideaInput')?.value || '').trim();
      if (text.length < 4) { state.error = '再多说一点：你想让它帮你完成什么？'; render(); return; }
      await run(async () => {
        if (!state.sessionId) {
          const s = await api('/api/session', {});
          state.sessionId = s.session.id;
        }
        const r = await api('/api/idea', { sessionId: state.sessionId, idea: text });
        state.idea = text;
        state.questions = r.questions;
        state.detected = r.detected;
        state.degradation = r.degradation;
        state.answers = {};
        state.step = 2;
      }, '正在理解你的需求……');
    };
  }

  document.querySelectorAll('[data-q]').forEach(b => b.onclick = () => {
    state.answers[b.dataset.q] = b.dataset.v;
    render();
  });

  if ($('answersBtn')) {
    $('answersBtn').onclick = async () => {
      await run(async () => {
        const r = await api('/api/answers', { sessionId: state.sessionId, answers: state.answers });
        state.options = r.options;
        state.unmet = r.unmet;
        state.blocked = null;
        state.step = 3;
      }, '正在匹配已验证电路……');
    };
  }

  document.querySelectorAll('[data-choose]').forEach(b => b.onclick = async () => {
    await run(async () => {
      const r = await api('/api/choose', { sessionId: state.sessionId, optionId: b.dataset.choose });
      if (r.blocked) {
        state.blocked = r;
        state.step = 3;
      } else {
        state.preview = r.preview;
        state.chosen = b.dataset.choose;
        state.step = 4;
      }
    }, '正在准备方案……');
  });

  if ($('generateBtn')) {
    $('generateBtn').onclick = async () => {
      await run(async () => {
        const name = ($('nameInput')?.value || '').trim();
        const r = await api('/api/generate', { sessionId: state.sessionId, projectName: name });
        state.result = r.result;
        state.step = 5;
      }, '正在生成原理图、PCB 并执行格式校验……');
    };
  }

  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
    const n = Number(b.dataset.go);
    state.error = '';
    if (n === 1) {
      // 回到第一步时重置会话，避免旧状态混入
      state.sessionId = null; state.result = null; state.preview = null;
      state.options = []; state.answers = {}; state.unmet = []; state.blocked = null;
      state.degradation = null; state.questions = []; state.detected = [];
    }
    state.step = n;
    render();
  });
}

async function run(fn, busyText){
  if (state.busy) return;
  state.busy = true; state.error = '';
  render();
  try {
    await fn();
  } catch (e) {
    state.error = e.message;
  } finally {
    state.busy = false;
    render();
  }
}

render();
</script>
</body>
</html>
