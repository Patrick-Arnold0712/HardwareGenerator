<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>嘉立创硬件 Agent · 从想法到工程包</title>
<style>
  :root{
    --bg:#f6f8fb; --card:#ffffff; --ink:#1a2433; --ink2:#5b6b80; --ink3:#8b98a8;
    --line:#e3e9f1; --brand:#1668e3; --brand-soft:#e8f1fe;
    --ok:#0f9d58; --ok-soft:#e6f6ec; --warn:#b45309; --warn-soft:#fef3e2;
    --bad:#c0392b; --bad-soft:#fdecea; --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font:17px/1.7 "PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:28px 20px 96px}

  /* 顶部 */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
  .brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;letter-spacing:.2px}
  .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#1668e3,#48a0ff);
    display:grid;place-items:center;color:#fff;font-size:17px;font-weight:800}
  .tagline{color:var(--ink2);font-size:14px;margin:2px 0 22px 44px}
  .mode{display:flex;background:#e9eef6;border-radius:99px;padding:3px;font-size:13px}
  .mode button{border:0;background:transparent;color:var(--ink2);padding:6px 14px;border-radius:99px;
    font:inherit;font-size:13px;cursor:pointer;transition:.15s}
  .mode button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(16,36,64,.12)}

  /* 进度 */
  .progress{margin:0 0 26px}
  .bar{height:6px;background:#e3e9f1;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#1668e3,#48a0ff);border-radius:99px;
    transition:width .35s ease}
  .bar-meta{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink2);margin-bottom:8px}
  .bar-meta b{color:var(--brand);font-weight:700}

  /* 卡片 */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:26px 26px 22px;box-shadow:0 2px 10px rgba(16,36,64,.04);margin-bottom:16px}
  h1{font-size:26px;line-height:1.4;margin:0 0 8px;letter-spacing:-.2px}
  h2{font-size:22px;line-height:1.45;margin:0 0 8px;letter-spacing:-.1px}
  .lead{color:var(--ink2);font-size:15.5px;margin:0 0 20px}
  h3{font-size:16px;margin:0 0 4px}
  p{margin:0 0 12px}

  /* 输入 */
  textarea{
    width:100%;min-height:120px;resize:vertical;padding:15px 16px;font:inherit;font-size:16.5px;
    color:var(--ink);background:#fbfcfe;border:1.5px solid var(--line);border-radius:12px;
    outline:none;transition:.15s;line-height:1.65;
  }
  textarea:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px var(--brand-soft)}
  textarea::placeholder{color:var(--ink3)}
  .count{font-size:13px;color:var(--ink3);text-align:right;margin-top:6px}

  /* 按钮 */
  .actions{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap}
  button{font:inherit;cursor:pointer;border-radius:11px;border:1.5px solid var(--line);
    background:#fff;color:var(--ink);padding:11px 20px;font-size:16px;transition:.15s}
  button:hover:not(:disabled){border-color:#c3d0e2;background:#fbfcfe}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700;
    box-shadow:0 2px 8px rgba(22,104,227,.24)}
  button.primary:hover:not(:disabled){background:#0d5bcc;border-color:#0d5bcc}
  button.plain{border-color:transparent;background:transparent;color:var(--ink2);padding:11px 8px}
  button.plain:hover:not(:disabled){color:var(--brand);background:transparent}
  .spacer{flex:1}

  /* 例子 */
  .samples{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .samples .label{font-size:14px;color:var(--ink3);align-self:center;margin-right:2px}
  .sample{font-size:14px;padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);
    background:#fff;color:var(--ink2)}
  .sample:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}

  /* 问题 */
  .q{padding:20px 0;border-top:1px solid var(--line)}
  .q:first-of-type{border-top:0;padding-top:4px}
  .q .why{font-size:14px;color:var(--ink3);margin:0 0 12px}
  .opts{display:grid;gap:9px}
  .opt{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px;
    border-radius:12px;border:1.5px solid var(--line);background:#fff;width:100%}
  .opt:hover{border-color:#b9cbe4;background:#fbfcfe}
  .opt .dot{width:19px;height:19px;border-radius:50%;border:2px solid #c9d5e5;flex:none;
    display:grid;place-items:center;transition:.15s}
  .opt .dot::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--brand);
    transform:scale(0);transition:.15s}
  .opt.sel{border-color:var(--brand);background:var(--brand-soft)}
  .opt.sel .dot{border-color:var(--brand)}
  .opt.sel .dot::after{transform:scale(1)}
  .opt .txt{flex:1;font-size:16px}
  .opt .sub{display:block;font-size:13.5px;color:var(--ink3);margin-top:1px}

  /* 提示条 */
  .note{border-radius:12px;padding:14px 16px;font-size:14.5px;margin:14px 0;line-height:1.65}
  .note b{display:block;margin-bottom:3px}
  .note.warn{background:var(--warn-soft);border-left:4px solid var(--warn);color:#7c3d06}
  .note.bad{background:var(--bad-soft);border-left:4px solid var(--bad);color:#8c2c20}
  .note.ok{background:var(--ok-soft);border-left:4px solid var(--ok);color:#0b6b3d}
  .note.info{background:var(--brand-soft);border-left:4px solid var(--brand);color:#12488f}

  /* 方案卡 */
  .plan{border:1.5px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px;background:#fff}
  .plan.pick{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
  .plan .head{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
  .plan .icon{width:42px;height:42px;border-radius:11px;background:var(--brand-soft);color:var(--brand);
    display:grid;place-items:center;font-size:20px;flex:none}
  .plan h3{font-size:18px;margin:0}
  .plan .sub{font-size:14px;color:var(--ink2);margin:2px 0 0}
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0}
  .fact{background:#f7f9fc;border-radius:10px;padding:10px 12px}
  .fact dt{font-size:12.5px;color:var(--ink3);margin-bottom:2px}
  .fact dd{margin:0;font-size:15px;font-weight:700}

  /* 步骤条 */
  .steps{display:flex;gap:6px;margin-bottom:18px;font-size:13px;color:var(--ink3);flex-wrap:wrap}
  .steps span{white-space:nowrap}
  .steps span.on{color:var(--brand);font-weight:700}
  .steps span.done{color:var(--ok)}
  .steps i{font-style:normal;color:#c8d3e2}

  /* 结果 */
  .status{display:flex;align-items:center;gap:14px;padding:18px;border-radius:14px;
    background:var(--ok-soft);border:1.5px solid #b7e3c8;margin-bottom:18px}
  .status .big{font-size:30px;line-height:1}
  .status h3{margin:0 0 2px;font-size:18px;color:#0b6b3d}
  .status p{margin:0;font-size:14px;color:#146c46}

  .dl{display:grid;gap:10px;margin:16px 0}
  .dl a{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;
    border:1.5px solid var(--line);text-decoration:none;color:var(--ink);background:#fff}
  .dl a:hover{border-color:var(--brand);background:var(--brand-soft)}
  .dl a .ic{width:36px;height:36px;border-radius:9px;background:#eef3fb;display:grid;place-items:center;
    font-size:17px;flex:none}
  .dl a b{display:block;font-size:16px}
  .dl a small{color:var(--ink3);font-size:13px}

  table{width:100%;border-collapse:collapse;font-size:14.5px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--ink3);font-weight:600;font-size:13.5px}
  tr:last-child td{border-bottom:0}

  .check{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
  .check:last-child{border-bottom:0}
  .check .mark{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;
    font-size:12px;font-weight:800;margin-top:2px}
  .check .mark.pass{background:var(--ok-soft);color:var(--ok)}
  .check .mark.not_run{background:#eef1f5;color:var(--ink3)}
  .check .mark.manual_required{background:var(--warn-soft);color:var(--warn)}
  .check .mark.fail{background:var(--bad-soft);color:var(--bad)}
  .check .body b{font-size:15px;display:block}
  .check .body small{color:var(--ink2);font-size:13.5px;line-height:1.55}

  .files{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:12px}
  .file{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;font-size:13.5px;
    border-bottom:1px solid var(--line)}
  .file:last-child{border-bottom:0}
  .file code{font-size:13px;color:var(--ink2)}
  .file span{color:var(--ink3);white-space:nowrap;font-size:12.5px}

  .err{color:var(--bad);font-size:14.5px;margin-top:12px;padding:12px 14px;
    background:var(--bad-soft);border-radius:10px}
  .busy{display:flex;align-items:center;gap:10px;color:var(--brand);font-size:14.5px;margin-top:14px}
  .spin{width:16px;height:16px;border:2.5px solid var(--brand-soft);border-top-color:var(--brand);
    border-radius:50%;animation:sp .8s linear infinite;flex:none}
  @keyframes sp{to{transform:rotate(360deg)}}

  details{border:1px solid var(--line);border-radius:12px;padding:0;margin-top:14px;background:#fbfcfe}
  details summary{padding:13px 16px;cursor:pointer;font-size:14.5px;color:var(--ink2);font-weight:600;
    list-style:none;display:flex;align-items:center;gap:8px}
  details summary::-webkit-details-marker{display:none}
  details summary::before{content:"▸";color:var(--ink3);transition:.15s}
  details[open] summary::before{transform:rotate(90deg)}
  details .inner{padding:0 16px 16px;font-size:14px;color:var(--ink2)}

  footer{color:var(--ink3);font-size:13px;margin-top:34px;line-height:1.9;text-align:center}
  .hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><span class="logo">造</span>造物硬件</div>
    <div class="mode" role="group" aria-label="显示模式">
      <button id="modeNovice" class="on">简单模式</button>
      <button id="modePro">专业模式</button>
    </div>
  </div>
  <div class="tagline">说出你想做什么，我们帮你做成一块能在嘉立创打开的电路板。</div>

  <div class="progress">
    <div class="bar-meta"><span id="stepName">第 1 步，共 5 步</span><b id="stepPct">20%</b></div>
    <div class="bar"><i id="barFill" style="width:20%"></i></div>
  </div>

  <main id="view"></main>

  <footer>
    当前只支持「LED 指示灯」和「RC 低通滤波」两类电路。<br>
    生成的是工程预览，不含外壳、固件和制造文件，不能直接下单生产。
  </footer>
</div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);

const state = {
  sessionId: null, step: 1, pro: false,
  idea: '', questions: [], answers: {}, detected: [], degradation: null,
  options: [], unmet: [], blocked: null, preview: null, result: null,
  busy: false, busyText: '', error: ''
};

function esc(v){
  return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function api(path, body){
  const res = await fetch(path, body === undefined ? {} : {
    method: 'POST',
    headers: {'content-type':'application/json'},
    body: JSON.stringify(body)
  });
  let data;
  try { data = await res.json(); } catch { throw new Error('服务器返回异常（HTTP ' + res.status + '）'); }
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}

const STEP_NAMES = ['说说想法','确认需求','选个方案','确认一下','拿到工程包'];

function renderChrome(){
  const pct = state.step * 20;
  $('stepName').textContent = `第 ${state.step} 步，共 5 步 · ${STEP_NAMES[state.step-1]}`;
  $('stepPct').textContent = pct + '%';
  $('barFill').style.width = pct + '%';
  $('modeNovice').classList.toggle('on', !state.pro);
  $('modePro').classList.toggle('on', state.pro);
}

function busyBlock(){
  return state.busy ? `<div class="busy"><span class="spin"></span>${esc(state.busyText || '处理中……')}</div>` : '';
}
function errBlock(){
  return state.error ? `<div class="err">${esc(state.error)}</div>` : '';
}

/* ---------- 第 1 步：说想法 ---------- */
function viewIdea(){
  return `
  <div class="card">
    <h1>你想做一个什么？</h1>
    <p class="lead">用大白话说就行，不用懂电路。比如想让它干什么、给谁用、放哪儿。</p>
    <textarea id="ideaInput" maxlength="600" placeholder="比如：我想做个小小的指示灯板，插上 5V 电源就亮，用来确认设备有没有通电。">${esc(state.idea)}</textarea>
    <div class="count"><span id="charCount">${state.idea.length}</span> / 600</div>
    <div class="samples">
      <span class="label">没想好？试试：</span>
      <button class="sample" data-sample="我想做一个 5V LED 指示灯板，插上电就亮，用来确认设备有没有通电。">指示灯板</button>
      <button class="sample" data-sample="我想做一个滤波电路，把信号里刺耳的高频噪声去掉，要能接输入和输出。">滤掉杂音</button>
    </div>
    <div class="actions">
      <button class="primary" id="beginBtn" ${state.busy?'disabled':''}>开始做</button>
    </div>
    ${busyBlock()}${errBlock()}
  </div>`;
}

/* ---------- 第 2 步：确认需求 ---------- */
function viewQuestions(){
  const d = state.degradation;
  const qs = state.questions.map((q, i) => `
    <div class="q">
      <h3>${esc(q.title)}</h3>
      <p class="why">${esc(q.desc)}</p>
      <div class="opts">
        ${q.options.map(o => {
          const sel = (state.answers[q.id] || 'auto') === o.value;
          return `<button class="opt ${sel?'sel':''}" data-q="${esc(q.id)}" data-v="${esc(o.value)}" role="radio" aria-checked="${sel}">
            <span class="dot"></span>
            <span class="txt">${esc(o.label)}${o.sub?`<span class="sub">${esc(o.sub)}</span>`:''}</span>
          </button>`;
        }).join('')}
      </div>
    </div>`).join('');

  return `
  <div class="card">
    <h1>还有三个小问题</h1>
    <p class="lead">都能改。不确定就选「帮我决定」，不会做错。</p>
    ${d ? `<div class="note warn"><b>我没完全听懂你的想法</b>${esc(d.reason)}${esc(d.supported)}${esc(d.action)}</div>` : ''}
    ${qs}
    <div class="actions">
      <button class="plain" data-go="1">返回改想法</button>
      <span class="spacer"></span>
      <button class="primary" id="answersBtn" ${state.busy?'disabled':''}>下一步</button>
    </div>
    ${busyBlock()}${errBlock()}
  </div>`;
}

/* ---------- 第 3 步：选方案 ---------- */
function viewOptions(){
  // 能做的排在前面，"做不了"的放在最后，避免小白先看到挫败感。
  const usable = state.options.filter(o => o.canGenerate);
  const blocked = state.options.filter(o => !o.canGenerate);

  const planCard = (o) => {
    const ok = o.canGenerate;
    return `
    <div class="plan ${ok?'':'dim'}">
      <div class="head">
        <div class="icon">${ok?'🔌':'❓'}</div>
        <div>
          <h3>${esc(o.title)}${ok?'':' <span style="font-size:13px;color:var(--warn)">（这个做不了）</span>'}</h3>
          <p class="sub">${esc(o.subtitle)}</p>
        </div>
      </div>
      ${ok ? `<dl class="facts">
        <div class="fact"><dt>要用几个零件</dt><dd>${o.parts} 个</dd></div>
        <div class="fact"><dt>零件位置</dt><dd style="font-size:13.5px">${o.designators.map(esc).join('、')}</dd></div>
      </dl>` : ''}
      <div class="note ${ok?'ok':'bad'}">${esc(o.reason)}</div>
      <div class="actions" style="margin-top:14px">
        <button class="${ok?'primary':''}" data-choose="${esc(o.id)}" ${state.busy?'disabled':''}>
          ${ok?'就用这个':'看看为什么不行'}
        </button>
      </div>
    </div>`;
  };

  const unmetNote = state.unmet.length ? `
    <div class="note warn">
      <b>有两件事我做不到，先跟你说清楚</b>
      ${state.unmet.map(u => '· ' + esc(u.message)).join('<br>')}
    </div>` : '';

  const blockedNote = state.blocked ? `
    <div class="note bad">
      <b>${esc(state.blocked.message)}</b>
      ${state.blocked.detail.map(esc).join('<br>')}
    </div>` : '';

  return `
  <div class="card">
    <h1>我找到一个能做的方案</h1>
    <p class="lead">下面这套对应真实能画出来的电路，不是示意图。</p>
    ${unmetNote}${blockedNote}
  </div>
  ${usable.map(planCard).join('')}
  ${blocked.length ? `<details style="margin-bottom:16px">
    <summary>还想做别的电路？先看看为什么不行</summary>
    <div class="inner">${blocked.map(planCard).join('')}</div>
  </details>` : ''}
  <div class="actions">
    <button class="plain" data-go="2">返回改需求</button>
  </div>
  ${busyBlock()}${errBlock()}`;
}

/* ---------- 第 4 步：确认 ---------- */
function viewPreview(){
  const p = state.preview;
  if (!p) return '<div class="card"><p>没有可以预览的方案。</p></div>';

  const bomRows = p.bomPlain.map(r => `<tr>
    <td>${esc(r.designator)}</td><td>${esc(r.what)}</td>
    <td>${esc(r.size)}</td><td>${esc(r.role)}</td></tr>`).join('');

  return `
  <div class="card">
    <h1>确认一下，就开工</h1>
    <p class="lead">下面这些会真的画成电路图，还会自动检查一遍格式。</p>
    <dl class="facts">
      <div class="fact"><dt>做什么</dt><dd>${esc(p.title)}</dd></div>
      <div class="fact" style="grid-column:1/-1"><dt>你的原话</dt><dd style="font-size:13.5px;font-weight:400">${esc(p.userIdea)}</dd></div>
      <div class="fact" style="grid-column:1/-1"><dt>它是怎么工作的</dt><dd style="font-weight:400;font-size:14.5px">${esc(p.circuitPlain || p.circuit)}</dd></div>
    </dl>
    <h3 style="margin-top:22px">要用到的零件</h3>
    <table><thead><tr><th>编号</th><th>是什么</th><th>大小</th><th>做什么用</th></tr></thead>
    <tbody>${bomRows}</tbody></table>
    ${p.unmet.length ? `<div class="note warn"><b>做不到的部分</b>${p.unmet.map(u=>'· '+esc(u.message)).join('<br>')}</div>` : ''}
    <div class="actions">
      <label style="font-size:14px;color:var(--ink2)">给它起个名字
        <input id="nameInput" value="${esc(p.defaultProjectName)}"
          style="margin-left:8px;padding:8px 12px;border:1.5px solid var(--line);border-radius:9px;font:inherit;font-size:14.5px">
      </label>
    </div>
    <div class="actions">
      <button class="plain" data-go="3">换个方案</button>
      <span class="spacer"></span>
      <button class="primary" id="generateBtn" ${state.busy?'disabled':''}>开始画板子</button>
    </div>
    ${busyBlock()}${errBlock()}
  </div>`;
}

/* ---------- 第 5 步：结果 ---------- */
function checkRow(c){
  const mark = { pass:'✓', fail:'✕', not_run:'–', manual_required:'!' }[c.status] || '·';
  return `<div class="check">
    <span class="mark ${esc(c.status)}">${mark}</span>
    <div class="body"><b>${esc(c.title)}</b><small>${esc(c.detail || '')}</small></div>
  </div>`;
}

function viewResult(){
  const r = state.result;
  if (!r) return '<div class="card"><p>还没有结果。</p></div>';
  const id = esc(state.sessionId);

  const passed = r.checks.filter(c => c.status === 'pass').length;
  const pending = r.checks.filter(c => c.status !== 'pass').length;
  // 只有真的跑过客户端回读，才能说"验证过能打开"。
  const clientChecked = r.checks.some(c => c.id === 'client.parse' && c.status === 'pass');

  return `
  <div class="card">
    <div class="status">
      <span class="big">🎉</span>
      <div>
        <h3>板子画好了</h3>
        <p>一共 ${r.artifacts.length} 个文件，格式检查已通过。${clientChecked
          ? '并且已经在嘉立创 EDA 里真实打开验证过。'
          : '但这次没有在嘉立创 EDA 里实际打开验证。'}</p>
      </div>
    </div>

    <div class="dl">
      <a href="/api/download/${id}/zip">
        <span class="ic">📦</span>
        <span><b>下载完整工程包</b><small>ZIP 压缩包，解压后用嘉立创 EDA 专业版 V4.1+ 打开</small></span>
      </a>
      <a href="/api/download/${id}/eprj3">
        <span class="ic">📄</span>
        <span><b>只下载工程文件</b><small>${esc(r.projectName)}.eprj3</small></span>
      </a>
    </div>

    <details>
      <summary>检查了哪些、哪些还没做（${passed} 项通过，${pending} 项未做）</summary>
      <div class="inner">
        <p style="margin:8px 0 4px">电路连接：<b>${esc(r.verification.nets.join(' → '))}</b></p>
        <p style="margin:0 0 12px">零件：${r.verification.schDesignators.map(esc).join('、')}</p>
        ${r.checks.map(checkRow).join('')}
      </div>
    </details>

    <details>
      <summary>文件清单（${r.artifacts.length} 个）</summary>
      <div class="inner" style="padding:0">
        <div class="files">
          ${r.artifacts.map(a => `<div class="file"><code>${esc(a.path)}</code><span>${(a.bytes/1024).toFixed(1)} KB</span></div>`).join('')}
        </div>
      </div>
    </details>

    <div class="note warn" style="margin-top:18px">
      <b>这不是能直接下单生产的东西</b>
      它是一个「工程预览」：电路和板子画出来了，但没有外壳、没有固件、没做 DRC 检查，也没导出生产文件。
      真要打样，还得找工程师再看一遍。
    </div>

    ${r.unmet.length ? `<div class="note warn"><b>这次没做到的部分</b>${r.unmet.map(u=>'· '+esc(u.message)).join('<br>')}</div>` : ''}

    <div class="actions">
      <button class="plain" data-go="1">再做一个新的</button>
    </div>
    ${errBlock()}
  </div>`;
}

function render(){
  renderChrome();
  const views = [viewIdea, viewQuestions, viewOptions, viewPreview, viewResult];
  $('view').innerHTML = views[state.step - 1]();
  bind();
}

function bind(){
  if ($('ideaInput')) {
    $('ideaInput').oninput = (e) => {
      state.idea = e.target.value;
      const c = $('charCount'); if (c) c.textContent = state.idea.length;
    };
  }
  document.querySelectorAll('[data-sample]').forEach(b => b.onclick = () => {
    state.idea = b.dataset.sample;
    if ($('ideaInput')) $('ideaInput').value = state.idea;
    const c = $('charCount'); if (c) c.textContent = state.idea.length;
  });

  if ($('beginBtn')) $('beginBtn').onclick = async () => {
    const text = ($('ideaInput')?.value || '').trim();
    if (text.length < 4) { state.error = '再多说一点吧，比如想让它干什么。'; render(); return; }
    await run(async () => {
      if (!state.sessionId) {
        const s = await api('/api/session', {});
        state.sessionId = s.session.id;
      }
      const r = await api('/api/idea', { sessionId: state.sessionId, idea: text, inputMode: state.pro ? 'pro' : 'novice' });
      state.idea = text;
      state.questions = r.questions;
      state.detected = r.detected;
      state.degradation = r.degradation;
      state.answers = {};
      state.step = 2;
    }, '正在理解你的想法……');
  };

  document.querySelectorAll('[data-q]').forEach(b => b.onclick = () => {
    state.answers[b.dataset.q] = b.dataset.v;
    render();
  });

  if ($('answersBtn')) $('answersBtn').onclick = async () => {
    await run(async () => {
      const r = await api('/api/answers', { sessionId: state.sessionId, answers: state.answers });
      state.options = r.options;
      state.unmet = r.unmet;
      state.blocked = null;
      state.step = 3;
    }, '正在找合适的电路……');
  };

  document.querySelectorAll('[data-choose]').forEach(b => b.onclick = async () => {
    await run(async () => {
      const r = await api('/api/choose', { sessionId: state.sessionId, optionId: b.dataset.choose });
      if (r.blocked) { state.blocked = r; state.step = 3; }
      else { state.preview = r.preview; state.step = 4; }
    }, '正在准备方案……');
  });

  if ($('generateBtn')) $('generateBtn').onclick = async () => {
    await run(async () => {
      const name = ($('nameInput')?.value || '').trim();
      const r = await api('/api/generate', { sessionId: state.sessionId, projectName: name });
      state.result = r.result;
      state.step = 5;
    }, '正在画电路图、排板子，请稍等十几秒……');
  };

  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
    const n = Number(b.dataset.go);
    state.error = '';
    if (n === 1) {
      state.sessionId = null; state.result = null; state.preview = null;
      state.options = []; state.answers = {}; state.unmet = []; state.blocked = null;
      state.degradation = null; state.questions = []; state.detected = [];
    }
    state.step = n;
    render();
  });
}

async function run(fn, text){
  if (state.busy) return;
  state.busy = true; state.busyText = text || ''; state.error = '';
  render();
  try { await fn(); }
  catch (e) { state.error = e.message; }
  finally { state.busy = false; state.busyText = ''; render(); }
}

$('modeNovice').onclick = () => { state.pro = false; render(); };
$('modePro').onclick = () => { state.pro = true; render(); };

render();
</script>
</body>
</html>
