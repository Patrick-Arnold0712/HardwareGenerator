<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>两个不同的核对入口</title><link rel="stylesheet" href="./styles.css"></head><body><main><small>HardwareGenerator · 两个独立入口</small><h1>先看你要核对什么</h1><div class="entry-grid"><section class="card"><h2>需求与资料审核</h2><p>输入一句需求，做有限解析、资料候选及五轴审核。不是通用工程可行性判断。</p><a href="../">进入既有需求审核</a></section><section class="card"><h2>温度条件核对</h2><p>自己选择内部/环境温度、温区与目标误差，对照固定BME280条件快照；不自动从文字推导这些参数。</p><a href="./index.html">进入温度条件核对</a></section></div><p class="notice">两者都不批准选型或整板。Typ不是保证，端点仍需确认，工程检查NOT_RUN。需求只在浏览器本地处理。</p></main></body></html>
